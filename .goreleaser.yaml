version: 2
project_name: kctx

before:
  hooks:
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run ./cmd/kctx completion "$s" > "completions/kctx.$s"; done'

builds:
  - id: kctx
    main: ./cmd/kctx
    binary: kctx
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc

homebrew_casks:
  - name: kctx
    repository:
      owner: eugene-panin
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/eugene-panin/kctx
    description: Kubernetes context switcher with client grouping and a TUI
    license: MIT
    completions:
      bash: completions/kctx.bash
      zsh: completions/kctx.zsh
      fish: completions/kctx.fish
    caveats: |
      kctx uses your normal kubeconfig. Names like client/cluster are grouped in the TUI.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/kctx"]
        end
      end
